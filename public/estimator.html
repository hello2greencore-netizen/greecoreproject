<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Green Core Instant Estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single wizard column that widens into a tier grid on the result screen */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#13201A; --muted:#5B6B62; --line:#D9E2DB;
  --green:#1E6B47; --green-soft:#E3F0E8; --amber:#B7791F; --amber-soft:#FBF1DF; --warn:#A34A2A;
  --display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Public Sans", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#16211B; --ink:#E6EEE8; --muted:#9AAEA2; --line:#2A3A31;
  --green:#5CC28D; --green-soft:#1B3427; --amber:#E2A84B; --amber-soft:#33281A; --warn:#E28B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#16211B; --ink:#E6EEE8; --muted:#9AAEA2; --line:#2A3A31;
  --green:#5CC28D; --green-soft:#1B3427; --amber:#E2A84B; --amber-soft:#33281A; --warn:#E28B6B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1120px}
.sample{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.sample b{color:var(--amber);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11.5px}
header.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--green);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.phone{font-size:13.5px;color:var(--muted)} .phone strong{color:var(--ink);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:18px}
.progress{display:flex;flex-direction:column;gap:8px}
.progress small{color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s ease}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,34px);line-height:1.1}
h2{font-size:clamp(21px,4vw,26px);line-height:1.15}
p{margin:0}
.lede{color:var(--muted);max-width:60ch}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;background:var(--surface);transition:border-color .15s, background .15s}
.opt strong{font-weight:600}
.opt span{font-size:13px;color:var(--muted)}
.opt:hover{border-color:var(--green)}
.opt:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt.off{opacity:.55;cursor:not-allowed}
.opt.off:hover{border-color:var(--line)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
input[type=text],input[type=tel],input[type=email]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;width:100%}
input:focus-visible{outline:3px solid var(--green);outline-offset:1px;border-color:var(--green)}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{font:inherit;font-weight:600;border-radius:9px;padding:12px 20px;cursor:pointer;border:1.5px solid var(--green);background:var(--green);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--green);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.link:focus-visible{outline:2px solid var(--green)}
.err{color:var(--warn);font-size:13.5px}
.note{background:var(--amber-soft);border-radius:10px;padding:14px 16px;font-size:14px}
/* result */
.rhead{display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tiers{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.tier{border:1.5px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface);position:relative;min-width:0}
.tier.pick{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.badge{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--line);color:var(--ink)}
.tier.pick .badge{background:var(--green);color:var(--surface)}
.tname{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.2}
.tsub{font-size:13px;color:var(--muted)}
.price{font-family:var(--display);font-size:clamp(22px,3vw,26px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1}
.mo{font-size:13px;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums}
.tier ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.tpl{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.box{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.box h3{font-size:16px}
.box ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:5px}
.addon{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-top:1px solid var(--line);padding-top:8px;font-variant-numeric:tabular-nums}
.addon:first-of-type{border-top:0;padding-top:0}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{all:unset;cursor:pointer;padding:7px 14px;font-size:13.5px;font-weight:600}
.toggle button[aria-pressed="true"]{background:var(--green);color:var(--surface)}
.toggle button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fine{font-size:12.5px;color:var(--muted);max-width:75ch}
.opt.pickable{position:relative;padding-left:46px}
.tick{position:absolute;left:16px;top:16px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface)}
.opt[aria-pressed="true"] .tick{background:var(--green);border-color:var(--green)}
.opt[aria-pressed="true"] .tick::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.glance{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.gl{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:10px;background:var(--green-soft);color:var(--ink);text-decoration:none;min-width:0}
.gl:hover{outline:1.5px solid var(--green)}
.gl-t{font-weight:600}.gl-p{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.gl-p.muted{font-size:15px;font-weight:600;color:var(--muted)}.gl-s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sys{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:18px;scroll-margin-top:16px}
.syshead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.plans{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plans-l{font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
.plan{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.plan[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}
.plan:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.mo-sub{font-size:12px;color:var(--muted)}
.pickadd{cursor:pointer;align-items:flex-start}
.pickadd input{margin-top:3px;accent-color:var(--green);flex:none}
.pickadd>span{flex:1}
.addon.pickadd{justify-content:flex-start;gap:10px}
.addon.pickadd strong{margin-left:auto;white-space:nowrap}
.hp-field{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.add-note{display:block;font-size:12px;color:var(--muted)}
.tpl-inline{display:block;font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.disc{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.about{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;max-width:85ch}
.about h3{font-size:14px;color:var(--ink)}
.about ul{margin:0;padding-left:18px;display:grid;gap:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.tsel{display:block;width:100%;font:inherit;font-size:13px;margin-top:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.pickadd>span{min-width:0}
/* follow-up: choose an option, book a visit or call, send photos */
.choose{margin-top:auto;width:100%;padding:10px 14px;font-size:14px}
.next{display:flex;flex-direction:column;gap:14px;border:1.5px solid var(--green);border-radius:14px;padding:clamp(16px,3vw,24px);background:var(--surface);scroll-margin-top:16px}
.next h3{font-size:16px}
.note.good{background:var(--green-soft)}
.days{display:flex;flex-direction:column;gap:12px}
.day{display:flex;flex-direction:column;gap:6px}
.day-l{font-size:13px;font-weight:600;color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--green)}
.slot[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}
.slot:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.photos{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.photo-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.photo-row>span{min-width:0}
.photo-btn{flex:none;padding:8px 14px;font-size:13.5px}
.photo-btn:focus-within{outline:3px solid var(--green);outline-offset:2px}
.opt[disabled]{cursor:default}
</style>

</head>

    qa: [
      {q:"Systems they wanted priced:", a:S.svcs.map(sysName).join(", ")},

      ...QS.filter(q=>q.need()).flatMap(q=>q.multi||[q]).map(q=>{ const v=S.a[q.id]; if(q.num) return {q:q.q, a:v?`${Number(v).toLocaleString("en-US")} sq ft`:"(skipped)"}; const o=q.o.find(x=>x[0]===v); return {q:q.q, a:o?o[1]:"(skipped)"}; })
    ],

// Short, plain-English summary for the HCP lead note.
function leadSummary(r, est, until){
  const a = S.a;
  const lab = (id, v) => { const q = [...QS, ...QS.flatMap(x=>x.multi||[])].find(x=>x.id===id); if(!q || v==null) return null; const o = q.o.find(x=>x[0]===v); return o ? o[1] : null; };
  const first = r.systems.find(s=>s.chosen) || r.systems.find(s=>!s.pending), pickT = pickedTier(first);
  const L = [];
  L.push(`Online estimate ${est} - good through ${until}`);
  L.push(sourceLine());
  if (pickT) L.push(`${S.choiceMade ? "Chose" : "Leaning toward"}: ${first.title} - ${pickT.name} (${pickT.label}) - ${money(pickT.price)}`);
  const others = r.systems.filter(s=>s!==first).map(s=>s.title + (s.pending?" (price at visit)":""));
  if (others.length) L.push(`${first ? "Also priced" : "Asked about"}: ${others.join(", ")}`);
  L.push("");
  if (ducted()) {
    const P = position(a), tons = tonsFor(a.sqft);
    const vents = P.orient==="Downflow" ? "floor vents (downflow)" : P.orient==="Upflow" ? (a.flow==="unsure" ? "not sure where vents are" : "ceiling vents (upflow)") : "horizontal";
    L.push(`Home: ${Number(a.sqft).toLocaleString("en-US")} sq ft (${tons} ton) - unit in the ${P.where} - ${vents}`);
    const now = a.current ? ({gas_ac:"Gas furnace and AC", gas:"Gas furnace, no AC", elec:"Electric furnace or older heat pump", unsure:"Not sure"})[a.current] : null;
    if (now) L.push(`Has now: ${now}`);
    const ac = lab("ac", a.ac); if (ac) L.push(`Has AC: ${ac}`);
    const vent = ({metal:"Metal pipe (standard 80%)", pvc:"Plastic pipes (high-efficiency)", unsure:"Not sure", none:"No furnace now"})[a.vent]; if (vent) L.push(`Furnace vent: ${vent}`);
  }
  if (has("mini")) L.push(a.rooms==="2" ? "Ductless: wants two or more rooms" : `Ductless: one room, about ${Number(a.room||0).toLocaleString("en-US")} sq ft${miniSize(a.room)?` (${miniSize(a.room)})`:" (too big to price online)"}`);
  if (has("whf") && !ducted()) L.push(`Whole house fan: ${Number(a.sqft).toLocaleString("en-US")} sq ft home`);
  if (has("hpwh")) L.push(`Water heater: ${a.whfuel==="gas"?"Gas":"Electric"} now - ${lab("people",a.people)} people - ${lab("baths",a.baths)} bathrooms - ${whGal()} gal - ${a.whloc==="move"?"wants it moved":"same spot"}`);
  L.push(`Owns the home: ${({own:"Yes", rent:"No, renting", landlord:"Landlord or manager"})[S.own] || "Not asked"}`);
  L.push("");
  const ups = r.addons.filter(x=>S.addons.includes(x.id));
  if (r.addons.length) L.push(`Upgrades picked: ${ups.length ? ups.map(x=>`${x.short} (${money(x.price)})`).join(", ") : "None"}`);
  L.push(`Financing: ${S.planTouched ? "Looked at " + plan().long : "Didn't look"}`);
  L.push(`Follow-up: ${S.bookedInfo ? `${S.bookedInfo.kind==="call"?"Phone call":"Verify visit"} booked ${fmtSlot(S.bookedInfo.start)} with ${S.bookedInfo.employee}` : S.follow ? `Looking at ${S.follow==="call"?"phone call":"visit"} times` : "Not booked yet"}`);
  return L;
}
// Send once, with the customer's final choices: when they click Book, leave or hide the page, or after 2 minutes on their prices.
function flushLead(){
  if (S.sent || S.step!=="result" || !S.leadMeta) return;
  S.sent = true; clearTimeout(S.leadTimer);
  const r = quoteAll();
  sendLead({...leadPayload(r, S.leadMeta.est, S.leadMeta.until), summary: leadSummary(r, S.leadMeta.est, S.leadMeta.until)});
}
addEventListener("visibilitychange", () => { if (document.visibilityState==="hidden") flushLead(); });
addEventListener("pagehide", flushLead);
function sendLead(payload){
  if(!SUBMIT_URL) return;
  S.leadPromise = fetch(SUBMIT_URL, {method:"POST", keepalive:true, headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)})
    .then(r=>r.json()).then(j=>{ S.leadId = j.lead_id || null; S.leadToken = j.token || null; }).catch(()=>{});
}
// Booking and photos need the lead to exist first; this sends it now if it hasn't gone yet.
async function ensureLead(){
  if(!S.leadId && !S.leadPromise) flushLead();
  if(S.leadPromise) await S.leadPromise;
  return !!(S.leadId || S.estimateId);
}
const api = path => SUBMIT_URL.replace(/\/$/,"") + path;
const followIds = () => ({lead_id:S.leadId, token:S.leadToken, estimate_id:S.estimateId, est_token:S.estToken});
const prettyPhone = p => { const d = String(p).replace(/\D/g,"").replace(/^1(?=\d{10}$)/,""); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : p; };
const fmtSlot = iso => new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
const FOLLOW = {
  visit:{title:"Book a 30-minute verify visit", sub:"We come out, check your setup, and confirm your price in writing.", done:"visit"},
  call:{title:"Schedule a 15-minute call", sub:"Talk through your options with Tony or Zach by phone.", done:"call"}
};
async function loadSlots(kind){
  S.slots = {kind, loading:true}; renderKeep();
  try {
    const j = await (await fetch(api(`/availability?kind=${kind}`))).json();
    S.slots = j.ok ? {kind, list:j.slots} : {kind, error:true};
  } catch(e) { S.slots = {kind, error:true}; }
  renderKeep();
}
async function confirmBooking(){
  const pick = S.slotPick; if(!pick || S.booking) return;
  S.booking = "busy"; renderKeep();
  try {
    if(!(await ensureLead())) throw new Error("no lead");
    const r = quoteAll();
    const res = await fetch(api("/book"), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
      ...followIds(), kind:S.follow, start:pick.start, employee_id:pick.employee_id, phone:S.c.phone, summary:leadSummary(r, S.leadMeta.est, S.leadMeta.until)})});
    const j = await res.json().catch(()=>({}));
    if(res.status===409){ S.booking = "taken"; S.slotPick = null; await loadSlots(S.follow); return; }
    if(!j.ok) throw new Error("book failed");
    S.estimateId = j.estimate_id; S.estToken = j.est_token;
    S.bookedInfo = {kind:j.kind, start:j.start, employee:j.employee}; S.booking = null;
    if(window.parent!==window) try { window.parent.postMessage({type:"gc-estimator-booked", kind:j.kind}, location.origin); } catch(e) {}
  } catch(e) { S.booking = "error"; }
  renderKeep();
}
const PHOTO_SLOTS = () => {
  const L = [];
  if(ducted()) L.push(["indoor","Furnace or indoor unit, plus its data plate (model and serial sticker)"]);
  if(has("hp","fac","acc","dual","dfx","mini")) L.push(["outdoor","Outdoor unit, plus its data plate"]);
  if(has("hpwh")) L.push(["waterheater","Water heater, its data plate, and the space around it"]);
  L.push(["panel","Electrical panel with the door open"],["other","Anything else you'd like us to see"]);
  return L;
};
// Shrink big phone photos before upload so they send quickly.
async function shrink(file){
  try {
    const img = await createImageBitmap(file); const max = 1600, sc = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
    return blob ? new File([blob], "photo.jpg", {type:"image/jpeg"}) : file;
  } catch(e) { return file; }
}
async function sendPhotos(){
  const items = PHOTO_SLOTS().flatMap(([k,l]) => (S.photos[k]||[]).map(f => ({k, l, f})));
  if(!items.length || S.photoState==="busy") return;
  S.photoState = "busy"; S.photoDone = 0; renderKeep();
  try {
    if(!(await ensureLead())) throw new Error("no lead");
    for(const it of items){
      const fd = new FormData(); const ids = followIds();
      for(const [k,v] of Object.entries(ids)) if(v) fd.append(k, v);
      fd.append("label", it.l.split(",")[0]); fd.append("file", await shrink(it.f));
      const j = await (await fetch(api("/photos"), {method:"POST", body:fd})).json();
      if(!j.ok) throw new Error("photo failed");
      S.estimateId = j.estimate_id; S.estToken = j.est_token; S.photoDone++; renderKeep();
    }
    S.photoState = "sent"; S.photosSent = (S.photosSent||0) + items.length; S.photos = {};
  } catch(e) { S.photoState = "error"; }
  renderKeep();
}

function flow(){ return ["service","area", ...QS.filter(q=>q.need()).map(q=>q.id), "contact", "result"]; }
function go(step){ S.step = step; render(); window.scrollTo({top:0}); if(window.parent!==window) window.parent.postMessage({type:"gc-estimator-top"}, "*"); }
function next(){ const f = flow(); go(f[f.indexOf(S.step)+1]); }
function back(){ const f = flow(); const i = f.indexOf(S.step); if(i>0) go(f[i-1]); }

function shell(inner, wide){
  const f = flow(), i = f.indexOf(S.step), total = f.length-1;
  const prog = S.step==="result" ? "" : `<div class="progress"><small>Step ${i+1} of ${total}</small><div class="bar"><span style="width:${Math.round(((i+1)/total)*100)}%"></span></div></div>`;

}

// 2-zone system, from HCP Pricebook > Materials > Zoning (Nov 23, 2026).
// Honeywell: 3-Zone Board 1H/1C for single-stage furnace and AC options, 2H/2C for two-stage furnaces and anything with a heat pump,

// Best (Carrier Infinity): Infinity 4-Zone Damper Control Module + Infinity Smart Sensor + 4 Carrier round dampers.
// Labor: 3 hours at $186/hr, times the 1.10 commission multiplier from the standard pricing formula = $614.
const ZONE = {board1h:318, board2h:454, hw10:301, hw14:349, tstat2:330, infModule:1149, infSensor:711, carrier10:381, carrier14:435, labor:Math.round(3*186*1.10)};
function zoneCost(sysId, k, tons){

}
function quoteAll(){
  const a = S.a;
  const Q = {hp:quoteHP, furnace:quoteFurnace, fac:()=>quoteCombo("fac","FAC"), dual:()=>quoteCombo("dual","DF"), dfx:quoteDFX, acc:quoteACC, mini:quoteMini, hpwh:quoteHPWH, whf:quoteWHF};
  const out = S.svcs.map(id => Q[id]());
  // The option the customer chose (defaults to the "Better" option of the first system).
  if(S.choice && !out.some(s => s.id===S.choice.sys && !s.pending && s.tiers.some(t => t.k===S.choice.k))) S.choice = null;
  if(!S.choice){ const f = out.find(s => !s.pending && s.tiers); if(f) S.choice = {sys:f.id, k:pickedTier(f).k}; }
  out.forEach(s => { s.chosen = !!S.choice && s.id===S.choice.sys; if(s.chosen) s.pickK = S.choice.k; });
  const flags = [];
  if(ducted()){
    if(a.flow==="unsure") flags.push("Which way your system blows air (priced as upflow)");
    if(a.current==="unsure") flags.push("Your current system type");
    if(a.current==="elec") flags.push("Electrical capacity check for an all-electric system");
    if(a.vent==="unsure" && has("furnace","fac","dual")) flags.push("Which furnace you have now (priced as a standard 80% furnace)");
  }
  if(has("hp","fac","acc","dual","dfx")) flags.push(hasAC() ? "Where the outdoor unit goes (priced in the same spot as your current AC; a new spot, wall bracket or roof mount can change the price)" : "Where the outdoor unit goes (priced on a ground pad near the house; a wall bracket or roof mount can change the price)");
  if(ducted()){
    if(position(a).attic) flags.push("Access and working space in your attic or crawlspace");
    if(!S.addons.includes("ducts")) flags.push("The condition of your ductwork (older ducts may need sealing or repairs)");
    if(S.addons.includes("zone") && !S.addons.includes("ducts")) flags.push("The 2-zone price assumes a new duct system");
    if(has("hp","fac","acc","dual","dfx") && !hasAC()) flags.push("A new electrical circuit or panel space may be needed for the outdoor unit");
  }
  if(has("mini") && a.rooms==="1") flags.push("Where the indoor unit mounts and how far the line set runs");
  if(has("hpwh") && a.whloc!=="move") flags.push("Space and airflow around the water heater, and a nearby outlet or circuit");
  if(has("whf")) flags.push("Attic space and venting for the fan (extra attic venting may be needed)", "A nearby electrical circuit for the fan");
  flags.push("Asbestos or other hazardous materials on old equipment or ducts");
  flags.push("Permit and inspection fees for your city or county");
  // Upgrades. "ducted" ones apply to heating and cooling systems, "hpwh" ones to heat pump water heaters.
  // skipBest: Best tiers already include an Infinity Touch control. perTier: price depends on the system and option.
  // Every upgrade is subject to compatibility with the equipment and install conditions (the customer is told this).
  const addons = [];
  if(ducted()){
    const aTons = tonsFor(a.sqft), tm = TSTATS.find(x=>x.k===S.tstatModel) || TSTATS[1];
    addons.push(
      {id:"ducts", for:"ducted", short:"New R-8 ducts", label:`New R-8 insulated duct system, sized for your ${aTons} ton system`, hcp:`${aTons} Ton R-8 Duct System`, price:DUCT[aTons]},
      {id:"zone", for:"ducted", short:"2-zone system", label:"2-zone system for uneven rooms*", hcp:"Zoning: zone board + 4 dampers + zone 2 thermostat + 3 hrs labor", perTier:(sysId,k)=>zoneCost(sysId,k,aTons),
        note:"*Price is with a new duct system. Includes a zone control board, 4 zone dampers, a thermostat or sensor for the second zone, and installation."},
      {id:"tstat", for:"ducted", short:tm.name, label:"Smart thermostat", select:true, hcp:`${tm.name} (Thermostats > With New System)`, price:tm.price, skipBest:true, note:"Best options already include a smart control"},
      {id:"uv", for:"ducted", short:"UV germicidal light", label:"UV germicidal light for your indoor coil", hcp:"Carrier UV Germicidal Light - Single Lamp (115V)", price:999},
      {id:"purifier", for:"ducted", short:"Whole-home air purifier", label:"Whole-home air purifier (Carrier Infinity), sized for your system", hcp:"Carrier Infinity Air Purifier", perTier:(sysId)=>purifierCost(sysId,aTons)}
    );
  }
  if(has("hpwh")) addons.push({id:"halo", for:"hpwh", short:"Halo 5 water filtration", label:"Halo 5 whole-home water filtration system", hcp:"Halo 5 Water Filtration System", price:5439});
  const appliesTo = (x, s) => x.for==="ducted" ? DUCTED.includes(s.id) : s.id==="hpwh";
  const priced = out.filter(s => !s.pending && s.tiers);
  // Per-option add-ons show the price for the customer's pick (or a range across the options shown).
  addons.filter(x=>x.perTier).forEach(x => {
    const ps = priced.filter(s => appliesTo(x, s));
    const all = ps.flatMap(s => s.tiers.map(t => x.perTier(s.id, t.k)));
    const first = ps[0], pk = first && (first.tiers.find(t=>t.k===first.pickK) || first.tiers[0]);
    x.price = pk ? x.perTier(first.id, pk.k) : (all.length ? Math.min(...all) : 0);
    const lo = all.length ? Math.min(...all) : x.price, hi = all.length ? Math.max(...all) : x.price;
    x.priceText = lo===hi ? `+${money(lo)}` : `+${money(lo)}–${money(hi)}`;
  });
  const sel = addons.filter(x=>S.addons.includes(x.id));
  priced.forEach(s => s.tiers.forEach(t => {
    const add = sel.filter(x=>appliesTo(x, s) && !(x.skipBest && t.k==="best")).reduce((n,x)=>n+(x.perTier ? x.perTier(s.id, t.k) : x.price),0);
    t.price += add; if(add) t.tpl += ` + add-ons (${money(add)})`; }));
  let cross = null;
  if(S.svcs.length===1 && has("furnace")){ const P = position(a); cross = `No AC, or an older one? A heat pump replaces your furnace and AC in one system. For your home it starts at ${money(PRICES.HP[`${hasAC()?"yes":"no"}.${P.key}.value`][TI[tonsFor(a.sqft)]])}.`; }
  const notes = [];
  if(ducted()){ const P = position(a); notes.push(`${a.sqft.toLocaleString("en-US")} sq ft home, ${P.where} install, ${P.orient.toLowerCase()}`); }
  if(has("whf") && !ducted()) notes.push(`${Number(a.sqft).toLocaleString("en-US")} sq ft home`);
  if(has("hpwh")) notes.push(`${whGal()} gallon water heater`);
  return {systems:out, flags, addons, cross, posNote:notes.join("; ")};
}

  const chosenLine = ct ? `<p class="lede">Your choice: <strong>${esc(cs.title)}: ${esc(ct.name)}, ${money(ct.price)}</strong>. Not quite right? Tap "Choose this option" on any card above.</p>` : `<p class="lede">These options are priced at your visit. Pick how you'd like to follow up.</p>`;
  let times = "";
  if(S.bookedInfo){
    const b = S.bookedInfo;
    times = `<div class="note good"><strong>You're booked: ${b.kind==="call"?"15-minute call":"30-minute verify visit"} on ${fmtSlot(b.start)} with ${esc(b.employee)}.</strong><br>${b.kind==="call" ? `${esc(b.employee)} will call you at ${esc(prettyPhone(S.c.phone))}.` : "You'll get a confirmation from Green Core."} Need to change it? Call (707) 988-5858.</div>`;
  } else if(S.follow){
    const sl = S.slots || {};
    if(sl.loading) times = `<p class="fine">Finding open times…</p>`;
    else if(sl.error || (sl.list && !sl.list.length)) times = `<div class="note">We couldn't load open times right now. Call us at (707) 988-5858 and we'll set it up, or check back in a bit.</div>`;
    else if(sl.list){
      const days = {}; sl.list.forEach((s,i) => { const d = new Date(s.start).toLocaleDateString("en-US",{timeZone:"America/Los_Angeles", weekday:"long", month:"short", day:"numeric"}); (days[d] = days[d] || []).push([s,i]); });
      const keys = Object.keys(days), show = S.showDays || 4;
      times = `<div class="days">${keys.slice(0, show).map(d => `<div class="day"><span class="day-l">${d}</span><div class="slots">${days[d].map(([s,i]) => `<button class="slot" data-slot="${i}" aria-pressed="${!!S.slotPick && S.slotPick.start===s.start}">${new Date(s.start).toLocaleTimeString("en-US",{timeZone:"America/Los_Angeles", hour:"numeric", minute:"2-digit"})}</button>`).join("")}</div></div>`).join("")}</div>
        ${keys.length > show ? `<button class="link" id="showTimes">Show more days</button>` : ""}
        ${S.booking==="taken" ? `<p class="err">Sorry, that time was just taken. Please pick another.</p>` : ""}
        ${S.booking==="error" ? `<p class="err">We couldn't book that online. Call us at (707) 988-5858 and we'll get you on the schedule.</p>` : ""}
        ${S.slotPick ? `<div class="cta"><button class="btn" id="confirmBook" ${S.booking==="busy"?"disabled":""}>${S.booking==="busy" ? "Booking…" : `Confirm ${fmtSlot(S.slotPick.start)}`}</button></div>` : ""}`;
    }
  }
  const slots = PHOTO_SLOTS();
  const photoRows = slots.map(([k,l]) => { const fs = S.photos[k] || []; return `<div class="photo-row"><span>${l}${fs.length ? `<span class="add-note">${fs.length} photo${fs.length>1?"s":""} ready · <button class="link" data-unphoto="${k}">Remove</button></span>` : ""}</span>
      <label class="btn ghost photo-btn">${fs.length ? "Add more" : "Add photo"}<input type="file" accept="image/*" multiple data-photo="${k}" hidden></label></div>`; }).join("");
  const nReady = slots.reduce((n,[k]) => n + (S.photos[k]||[]).length, 0);
  const photoStatus = S.photoState==="busy" ? `<p class="fine">Sending ${S.photoDone+1 > nReady ? nReady : S.photoDone+1} of ${nReady}…</p>`
    : S.photoState==="sent" ? `<div class="note good">Got your photos, thanks! We'll use them to confirm your price.</div>`
    : S.photoState==="error" ? `<p class="err">Some photos didn't send. Try again, or text them to (707) 988-5858.</p>` : "";
  return `<section class="next" aria-labelledby="next-h">
    <h2 id="next-h">Next: confirm your price</h2>
    ${chosenLine}
    <div class="opts">${Object.entries(FOLLOW).map(([k,f]) => `<button class="opt" data-follow="${k}" aria-pressed="${S.follow===k || (S.bookedInfo && S.bookedInfo.kind===k)}" ${S.bookedInfo?"disabled":""}><strong>${f.title}</strong><span>${f.sub}</span></button>`).join("")}</div>
    ${times}
    <div class="photos"><h3>Send photos (optional)</h3><p class="fine">Photos help us confirm your price faster. Add any you can.</p>
      ${photoRows}
      ${nReady && S.photoState!=="busy" ? `<div class="cta"><button class="btn" id="sendPhotos">Send ${nReady} photo${nReady>1?"s":""}</button></div>` : ""}
      ${photoStatus}</div>
    <p class="fine">Prefer to talk now? Call <strong>(707) 988-5858</strong>.</p>
  </section>`;
}
function renderResult(){
  const r = quoteAll();
  const today = new Date(), until = new Date(today.getTime()+14*864e5);
  const fmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const est = "GC-" + today.getFullYear() + String(today.getMonth()+1).padStart(2,"0") + String(today.getDate()).padStart(2,"0") + "-" + (S.zip.slice(-2)||"00") + "7";
  const first = (S.c.name||"there").split(" ")[0];
  const multi = r.systems.length > 1;
  const glance = multi ? `<div class="glance">${r.systems.map(s=>`<a class="gl" href="#sys-${s.id}"><span class="gl-t">${s.title}</span>${s.pending?`<span class="gl-p muted">Priced at your visit</span>`:`<span class="gl-p">from ${money(Math.min(...s.tiers.map(t=>t.price)))}</span><span class="gl-s">${s.tiers.length>1?`${s.tiers.length} options up to ${money(Math.max(...s.tiers.map(t=>t.price)))}`:"1 option"}</span>`}</a>`).join("")}</div>` : "";
  shell(`
    <div class="rhead"><h1>${esc(first)}, here are your prices</h1>
      <p class="lede">${r.posNote?r.posNote+". ":""}${multi?"Compare the options below and pick what fits.":"Pick the option that fits."} Your final price is confirmed after a free visit or photo review.</p>
      <div class="meta"><span>Estimate ${est}</span><span>Valid through ${fmt(until)}</span><span>ZIP ${esc(S.zip)}</span></div></div>
    ${glance}
    <div class="row"><div class="plans" role="group" aria-label="Monthly payment options"><span class="plans-l">Monthly payments:</span>${PLANS.map(p=>`<button class="plan" data-plan="${p.id}" aria-pressed="${plan().id===p.id}">${p.short}${p.apr?` · ${p.apr}%`:""}</button>`).join("")}</div></div>
    ${r.systems.map(s=>`<section class="sys" id="sys-${s.id}">
      <div class="syshead"><div><h2>${s.title}</h2><p class="muted">${s.note}</p></div>
        ${s.toggle?`<div class="toggle" role="group" aria-label="Furnace option"><button data-eff="80" data-for="${s.id}" aria-pressed="${s.eff===80}">80% swap</button><button data-eff="95" data-for="${s.id}" aria-pressed="${s.eff===95}">Upgrade to 95%</button></div>`:""}</div>
      ${s.pending?`<p class="note">${s.custNote||"We'll price this one at your free visit."}</p>`:tierCards(s)}
    </section>`).join("")}
    <p class="disc">These are estimated prices based on your answers, not a final quote. Your final price is confirmed after a free visit or photo review.</p>
    ${r.cross?`<p class="note">${r.cross}</p>`:""}
    <div class="cols">
      <div class="box"><h3>Every option includes</h3><ul>${includesList().map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="box"><h3>What could change your price</h3>${r.flags.length?`<ul>${r.flags.map(f=>`<li>${f}</li>`).join("")}</ul>`:`<p class="fine">Nothing flagged. Your answers were clear, so these prices should hold.</p>`}
        <p class="fine">See "About this estimate" below for what's not included.</p></div>
      ${r.addons.length?`<div class="box"><h3>Popular upgrades</h3><p class="fine">Tick any you'd like included in your prices above. All upgrades are subject to compatibility with your equipment and install conditions, confirmed at your free visit.</p>${r.addons.map(x=>`<label class="addon pickadd" for="ad-${x.id}"><input type="checkbox" id="ad-${x.id}" data-add="${x.id}" ${S.addons.includes(x.id)?"checked":""}><span>${x.label}${x.select?` <select class="tsel" data-tstat aria-label="Thermostat model">${TSTATS.map(m=>`<option value="${m.k}" ${m.k===S.tstatModel?"selected":""}>${esc(m.name.replace("Ecobee Smart Thermostat","Ecobee").replace(" (4th Gen)",""))} (${money(m.price)})</option>`).join("")}</select>`:""}${x.note?`<span class="add-note">${x.note}</span>`:""}</span><strong>${x.priceText || "+"+money(x.price)}</strong></label>`).join("")}</div>`:""}
    </div>
    ${nextSteps(r)}
    <section class="about" aria-labelledby="abt">
      <h3 id="abt">About this estimate</h3>
      <p>This online estimate is based on the information you provided and standard installation conditions. It is not a final quote or a guaranteed price. Your final price will be confirmed in writing after a free in-home visit or photo review.</p>
      <p>Estimated prices include the equipment shown, a standard installation, removal of old equipment, and startup. Heating and cooling prices assume up to 50 feet of refrigerant line set and that existing control wiring, ductwork, and electrical service can be reused. Water heater prices assume the new unit goes in the same spot as the old one. Upgrades are subject to compatibility with your equipment and install conditions.</p>
      <p>Not included unless shown on your final quote:</p>
      <ul><li>Ductwork repair, modification, or replacement</li><li>Electrical work, including new circuits, outlets, panel upgrades, or service changes</li><li>Line sets longer than 50 feet</li><li>Control (thermostat) wiring repair or replacement</li><li>Changes needed to fit equipment in the available space or meet clearances</li><li>Limited or difficult access to attics, crawlspaces, roofs, or equipment locations</li><li>Crane or lift fees</li><li>Permit fees and any required inspections</li><li>Conditions we can't see or confirm online, including code corrections, damage, or hazardous materials</li></ul>
      <p>Estimate valid for 14 days. *Financing is subject to credit approval; monthly payments are estimates only.</p>
    </section>`, true);
  document.querySelectorAll("[data-eff]").forEach(b => b.onclick = () => { S.effs[b.dataset.for]=+b.dataset.eff; const y=window.scrollY; renderResult(); window.scrollTo({top:y}); });
  if(!S.leadMeta){ S.leadMeta = {est, until: fmt(until)}; S.leadTimer = setTimeout(flushLead, 120000); notifyLead(r); }
  document.querySelectorAll("[data-tstat]").forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = () => { S.tstatModel = s.value; const y=window.scrollY; renderResult(); window.scrollTo({top:y}); }; });
  document.querySelectorAll("[data-add]").forEach(c => c.onchange = () => { const id=c.dataset.add; S.addons = c.checked ? [...S.addons, id] : S.addons.filter(x=>x!==id); const y=window.scrollY; renderResult(); window.scrollTo({top:y}); });
  document.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { S.plan=b.dataset.plan; S.planTouched=true; const y=window.scrollY; renderResult(); window.scrollTo({top:y}); });
  document.querySelectorAll("[data-choose]").forEach(btn => btn.onclick = () => { const [sys,k] = btn.dataset.choose.split("|"); S.choice = {sys,k}; S.choiceMade = true; renderKeep(); });
  document.querySelectorAll("[data-follow]").forEach(btn => btn.onclick = () => { if(S.bookedInfo) return; S.follow = btn.dataset.follow; S.slotPick = null; S.booking = null; loadSlots(S.follow); });
  document.querySelectorAll("[data-slot]").forEach(btn => btn.onclick = () => { const s = S.slots.list[+btn.dataset.slot]; S.slotPick = s; S.booking = null; renderKeep(); });
  const cb = $("#confirmBook"); if(cb) cb.onclick = confirmBooking;
  document.querySelectorAll("[data-photo]").forEach(inp => inp.onchange = () => { const k = inp.dataset.photo; S.photos[k] = [...(S.photos[k]||[]), ...inp.files].slice(0,4); S.photoState = null; renderKeep(); });
  document.querySelectorAll("[data-unphoto]").forEach(x => x.onclick = () => { delete S.photos[x.dataset.unphoto]; renderKeep(); });
  const sp = $("#sendPhotos"); if(sp) sp.onclick = sendPhotos;
  const st = $("#showTimes"); if(st) st.onclick = () => { S.showDays = (S.showDays||4) + 4; renderKeep(); };
}

render();

// ---------- Website embed: tell the parent page how tall the estimator is ----------
(function(){
  if(window.parent===window) return;
  let last=0;
  const send=()=>{ const b=document.body, cs=getComputedStyle(b); const h=Math.ceil(b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom)); if(h!==last){ last=h; window.parent.postMessage({type:"gc-estimator-height", height:h}, "*"); } };
  new ResizeObserver(send).observe(document.body); window.addEventListener("load", send); send();
})();
</script>

</body>
</html>
